name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/ModelPaintPal/mobile/**'
      - 'src/ModelPaintPal/app/**'
      - 'src/ModelPaintPal/buildozer.spec'
      - 'src/ModelPaintPal/main.py'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            python3-pip python3-dev python3-venv

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade "buildozer==1.6.0"

      - name: Build debug APK
        working-directory: src/ModelPaintPal
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Report failure tail
        if: failure()
        working-directory: src/ModelPaintPal
        run: |
          echo "===== build.log tail ====="
          tail -n 250 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelPaintPal-debug-apk
          path: src/ModelPaintPal/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/ModelPaintPal/build.log
          if-no-files-found: ignore
          retention-days: 7
